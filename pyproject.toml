[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pulsegate"
version = "1.0.0"
description = "Multi signal face liveness detection: passive texture analysis, random challenges, depth from motion and remote pulse."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "opencv-python>=4.8",
    "onnxruntime>=1.16",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
train = ["torch>=2.1", "onnx>=1.15", "scikit-learn>=1.3", "matplotlib>=3.7"]
dev = ["pytest>=7.4", "httpx>=0.26"]

[project.scripts]
pulsegate = "pulsegate.cli:main"

[tool.setuptools.packages.find]
include = ["pulsegate*"]

[tool.setuptools.package-data]
pulsegate = ["apps/static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
